    body {

.page12 {

}

.mainmenu {
  border-style: solid;
  border-color: white;
  position: relative;
  top: -50px;
  left: 40px;
}

.options {
  color: white;
  position: relative;
  top: 10px;
  left: 70px;
}

.menu ul {
  list-style: none;
  margin: 0;
  padding: 0;
}

.menu > ul > li {
  position: relative;
  display: inline-block;
}

.menu a {
  display: block;
  padding: 10px 14px;
  text-decoration: none;
  background: #333;
  color: #fff;
}

.menu a:hover {
  background: #555;
}

/* dropdown */
.dropdown-content {
  position: absolute;
  top: 100%;
  left: 0;
  background: black;
  min-width: 160px;
  display: none;
  box-shadow: 0 6px 12px rgba(0,0,0,0.2);
  z-index: 100;
}

.dropdown-content a {
  color: #333;
  background: #fff;
}

.dropdown-content a:hover {
  background: #f2f2f2;
}


.dropdown:hover .dropdown-content {
  display: block;
}

.speech {
  position: relative;
  background: #fff;
  padding: 16px 20px;
  border-radius: 12px;
  width: fit-content;
  max-width: 150px;
  font-family: sans-serif;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

/* right tail */
.speech.right::before {
  content: "";
  position: absolute;
  right: -10px;
  top: 50%;
  transform: translateY(-50%);
  border-width: 10px 0 10px 10px;
  border-style: solid;
  border-color: transparent transparent transparent #fff;
}

.speech2 {
  position: relative;
  top: -220px;
  background: #fff;
  padding: 16px 20px;
  border-radius: 12px;
  width: fit-content;
  max-width: 80px;
  font-family: "Libre Baskerville", sans-serif;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

.speech2.right::before {
  content: "";
  position: absolute;
  right: -10px;
  top: 50%;
  transform: translateY(-50%);
  border-width: 10px 0 10px 10px;
  border-style: solid;
  border-color: transparent transparent transparent #fff;
}
